name: npm alpha release
# Manual only. Preparing artifacts is the default; publication is explicit.
on:
  workflow_dispatch:
    inputs:
      npm_scope:
        description: 'Owned public npm scope, including @ (not @magicvault-local)'
        required: true
        type: string
      publish:
        description: 'Publish the verified packages to npm under the alpha tag'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: magicvault-npm-alpha
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, platform: darwin-arm64, arch: arm64, target: aarch64-apple-darwin }
          - { os: macos-15-intel, platform: darwin-x64, arch: x64, target: x86_64-apple-darwin }
          - { os: ubuntu-22.04, platform: linux-x64, arch: x64, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, platform: linux-arm64, arch: arm64, target: aarch64-unknown-linux-gnu }
          - { os: windows-2022, platform: win32-x64, arch: x64, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, platform: win32-arm64, arch: arm64, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      NPM_SCOPE: ${{ inputs.npm_scope }}
      PLATFORM: ${{ matrix.platform }}
      RUST_TARGET: ${{ matrix.target }}
      CARGO_BUILD_JOBS: '2'
      CARGO_TARGET_DIR: target
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          architecture: ${{ matrix.arch }}
      - name: Validate release input and runner
        run: |
          node --input-type=module -e 'const s=process.env.NPM_SCOPE; if (!/^@[a-z0-9][a-z0-9-]{0,63}$/.test(s) || s.trim() !== s || s === "@magicvault-local" || `${process.platform}-${process.arch}` !== process.env.PLATFORM) process.exit(1);'
      - name: Install Linux build and desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libgl1-mesa-dev
      - name: Select toolchain
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          rustup override set 1.92.0
          rustup target add "$RUST_TARGET"
      - name: Bundle the Windows C runtime statically
        if: runner.os == 'Windows'
        run: printf '%s\n' 'RUSTFLAGS=-C target-feature=+crt-static' >> "$GITHUB_ENV"
      - name: Source, platform and package checks
        run: |
          python scripts/check_architecture.py
          cargo test --locked --target "$RUST_TARGET" -p magicvault-primitives -p magicvault-prompt -p magicvault-service --lib
          node --test scripts/tests/platform-packages.test.mjs
      - name: Build all four native executables
        run: cargo build --locked --release --target "$RUST_TARGET" -p magicvault -p magicvault-mcp -p magicvault-prompt --features magicvault-prompt/desktop
      - name: Assemble alpha packages and scope-specific README
        run: |
          mkdir -p dist
          node scripts/package-npm.mjs --binary-dir "target/$RUST_TARGET/release" --output dist/packages --scope "$NPM_SCOPE" --platform "$PLATFORM" --registry-readme
      - name: Execute the actual packaged CLI and MCP
        run: |
          node --input-type=module -e 'import {execFileSync} from "node:child_process"; import fs from "node:fs"; import path from "node:path"; const v=JSON.parse(fs.readFileSync("dist/packages/native/package.json")).version; for(const n of ["magicvault","magicvault-mcp"]) { const f=path.resolve("dist/packages/native/bin",n+(process.platform==="win32"?".exe":"")); if(execFileSync(f,["--version"],{encoding:"utf8",timeout:10000}).trim()!==`${n} ${v}`) process.exit(1); }'
      - name: Pack exact release tarballs without lifecycle scripts
        run: node scripts/release-npm.mjs --mode pack --packages dist/packages --output dist/tarballs --scope "$NPM_SCOPE" --platform "$PLATFORM"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MagicVault-alpha-${{ matrix.platform }}
          path: dist/tarballs/
          if-no-files-found: error
          retention-days: 14
  verify:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      NPM_SCOPE: ${{ inputs.npm_scope }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: MagicVault-alpha-*
          path: dist/release
      - name: Verify the complete seven-package release set
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([0-9.]*\)"$/\1/p' magicvault/Cargo.toml)
          node scripts/release-npm.mjs --root dist/release --scope "$NPM_SCOPE" --version "$version" > release-plan.json
      - name: Test release ordering, integrity and failure handling
        run: node --test scripts/tests/npm-release.test.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MagicVault-alpha-release-plan
          path: release-plan.json
          if-no-files-found: error
  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: [build, verify]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      NPM_SCOPE: ${{ inputs.npm_scope }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org/'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: MagicVault-alpha-*
          path: dist/release
      - name: Publish native packages first, common launcher last
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version=$(sed -n 's/^version = "\([0-9.]*\)"$/\1/p' magicvault/Cargo.toml)
          node scripts/release-npm.mjs --mode publish --root dist/release --scope "$NPM_SCOPE" --version "$version"
