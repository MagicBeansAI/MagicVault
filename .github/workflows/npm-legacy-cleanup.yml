name: npm legacy cleanup
# Explicit recovery of the requested 0.9.0 cleanup; never publishes packages.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: magicvault-npm-release
  cancel-in-progress: false
jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
  cleanup:
    if: github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org/'
      - name: Remove only obsolete 0.9.0 after verifying latest 0.9.2 and preserved 0.9.1
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/release-npm.mjs --mode remove-legacy --scope @magicbeansai --version 0.9.2
