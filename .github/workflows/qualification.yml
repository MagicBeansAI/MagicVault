name: Manual qualification
# Explicit opt-in only. Source packaging and setup never dispatch verification.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  libraries:
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: '4'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Select the candidate toolchain
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          rustup override set 1.92.0
      - run: make test-build-paths
      - run: make test-architecture
      - run: make check
      - run: make test
      - run: make test-extension
      - run: make test-qualification-fixtures
      - run: make test-service-reliability
