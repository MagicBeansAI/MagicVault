name: Manual qualification
# Explicit opt-in only. Source packaging and setup never dispatch verification.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  libraries:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: make check
      - run: make test
      - run: node --test extension/tests/fill.test.cjs extension/tests/worker.test.cjs
      - run: make test-qualification-fixtures
