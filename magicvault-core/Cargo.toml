[package]
name = "magicvault-core"
version = "0.1.0"
edition = "2021"
authors = ["MagicBeansAI"]
description = "Credential custody, policy, and redaction primitives for trusted integrations"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MagicBeansAI/MagicVault"

[features]
# Only scoped-store seeding is shared with downstream tests; no keychain fallback.
test-fixtures = []

[dependencies]
magicvault-primitives = { path = "../magicvault-primitives", version = "0.1.0" }
aes-gcm = "0.10"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
rand = "0.8"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["rt", "sync"] }
tracing = "0.1"
url = "2.4"
urlencoding = "2.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
zeroize = { version = "1.7", features = ["derive"] }

[dev-dependencies]
static_assertions = "1"
tempfile = "3.8"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "time"] }
