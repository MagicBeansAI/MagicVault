[package]
name = "magicvault-effect"
version = "0.6.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Trusted browser, HTTP and process credential delivery adapters for MagicVault"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(magicvault_test_diagnostics)'] }

[dependencies]
magicvault-protocol = { path = "../magicvault-protocol", version = "0.6.0" }
async-trait = "0.1"
futures-util = { version = "0.3", features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "sync", "time", "macros", "io-util"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls-native-roots", "stream"] }
tool-runtime-core = { git = "https://github.com/MagicBeansAI/MagicRun.git", version = "0.1.73" }
blake3 = "1"
libc = "0.2"

[dev-dependencies]
rcgen = "0.13"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
magicvault-test-support = { path = "../test-support" }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "process"] }
