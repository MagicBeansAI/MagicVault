[package]
name = "magicvault-effect"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Trusted browser credential delivery adapters for MagicVault"

[dependencies]
magicvault-protocol = { path = "../magicvault-protocol", version = "0.3.0" }
async-trait = "0.1"
futures-util = { version = "0.3", features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "sync", "time", "macros", "io-util"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"

[dev-dependencies]
magicvault-test-support = { path = "../test-support" }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "process"] }
