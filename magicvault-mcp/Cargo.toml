[package]
name = "magicvault-mcp"
version = "0.8.2"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Official-SDK MCP client surface for the MagicVault daemon"

[dependencies]
magicvault-service = { path = "../magicvault-service", version = "0.8.2" }
rmcp = { version = "=3.1.0", default-features = false, features = ["server", "transport-async-rw"] }
clap = { version = "4", features = ["derive"] }
serde = "1"
serde_json = "1"
bytes = "1"
futures-util = { version = "0.3", features = ["sink"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "sync"] }
tokio-util = { version = "0.7", features = ["codec"] }
# Keep dependency payload logging disabled in the shipped model-facing surface.
log = { version = "0.4", features = ["max_level_off", "release_max_level_off"] }

[dev-dependencies]
magicvault-test-support = { path = "../test-support" }
magicvault-core = { path = "../magicvault-core", version = "0.1.3" }
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
rmcp = { version = "=3.1.0", default-features = false, features = ["client"] }
tempfile = "3"
