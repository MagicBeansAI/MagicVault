[package]
name = "magicvault-primitives"
version = "0.1.2"
edition = "2021"
authors = ["MagicBeansAI"]
description = "Stack-safe JSON and durable file primitives shared by MagicVault integrations"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MagicBeansAI/MagicVault"

[dependencies]
blake3 = "1.0"
serde = "1.0"
serde_json = "1.0"
tokio = { version = "1.0", features = ["time", "net", "io-util"] }
tracing = "0.1"
uuid = { version = "1.0", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_Memory", "Win32_System_IO"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
tempfile = "3.8"
