[package]
name = "magicvault-prompt"
version = "0.9.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Private desktop consent window for MagicVault"

[features]
default = []
desktop = ["dep:eframe", "dep:log"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
eframe = { version = "=0.33.0", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
log = { version = "0.4", optional = true, features = ["max_level_off", "release_max_level_off"] }

[[bin]]
name = "magicvault-prompt"
path = "src/main.rs"
required-features = ["desktop"]
