[package]
name = "magicvault"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "MagicVault human CLI and standalone daemon"

[dependencies]
magicvault-service = { path = "../magicvault-service", version = "0.2.0" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
uuid = "1"

[dev-dependencies]
magicvault-core = { path = "../magicvault-core", version = "0.1.1" }
async-trait = "0.1"
tempfile = "3"
tokio-util = { version = "0.7", features = ["rt"] }
zeroize = "1"
